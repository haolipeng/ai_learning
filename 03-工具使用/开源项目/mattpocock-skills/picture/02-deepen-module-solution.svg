<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">把浅模块深化成深模块</title>
  <desc id="desc">展示如何判断一个候选项是否值得改，以及深模块如何通过稳定入口把细节收回模块内部。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        fill: #e2e8f0;
      }
      .title { font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 13px; fill: #94a3b8; }
      .panel-title { font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .panel-subtitle { font-size: 12px; fill: #cbd5e1; }
      .box-title { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .box-sub { font-size: 11px; fill: #cbd5e1; }
      .label { font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .small { font-size: 11px; fill: #94a3b8; }
      .tiny { font-size: 10px; fill: #94a3b8; }
      .good { font-size: 12px; font-weight: 700; fill: #bbf7d0; }
    </style>
  </defs>

  <rect width="980" height="620" fill="#0f172a"/>
  <rect width="980" height="620" fill="url(#grid)"/>

  <text x="48" y="56" class="title">怎么变成深模块？</text>
  <text x="48" y="82" class="subtitle">先判断是否能收拢细节，再让外部只依赖一个稳定入口。</text>

  <g transform="translate(72,148)">
    <rect x="0" y="0" width="220" height="282" rx="16" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="282" rx="16" fill="rgba(59,130,246,0.22)" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="110" y="42" class="box-title" text-anchor="middle">值不值得改？</text>

    <path d="M 110 72 L 110 118" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <rect x="40" y="120" width="140" height="58" rx="8" fill="rgba(15,23,42,0.92)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="110" y="144" class="tiny" text-anchor="middle">能不能换成</text>
    <text x="110" y="162" class="tiny" text-anchor="middle">更简单的用法？</text>

    <path d="M 110 186 L 110 224" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <text x="110" y="248" class="good" text-anchor="middle">能收拢细节</text>
    <text x="110" y="266" class="tiny" text-anchor="middle">才值得深化</text>
  </g>

  <path d="M 310 286 L 390 286" stroke="#34d399" stroke-width="2.2" filter="url(#soft-glow)" marker-end="url(#arrow-emerald)"/>

  <rect x="408" y="126" width="500" height="420" rx="14" fill="rgba(6,78,59,0.18)" stroke="#34d399" stroke-width="1.5"/>
  <text x="658" y="164" class="panel-title" text-anchor="middle">After: 深模块</text>
  <text x="658" y="187" class="panel-subtitle" text-anchor="middle">外部只依赖一个稳定入口</text>

  <g transform="translate(468,214)">
    <rect x="0" y="0" width="380" height="66" rx="10" fill="#0f172a"/>
    <rect x="0" y="0" width="380" height="66" rx="10" fill="rgba(15,23,42,0.88)" stroke="#34d399" stroke-width="1.4"/>
    <text x="22" y="27" class="label">调用方 A / B / C</text>
    <text x="22" y="48" class="small">只依赖一个稳定入口，不需要知道内部步骤</text>

    <path d="M 190 68 L 190 104" fill="none" stroke="#34d399" stroke-width="2" filter="url(#soft-glow)" marker-end="url(#arrow-emerald)"/>

    <rect x="72" y="106" width="236" height="60" rx="10" fill="#0f172a"/>
    <rect x="72" y="106" width="236" height="60" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="190" y="132" class="box-title" text-anchor="middle">稳定入口</text>
    <text x="190" y="153" class="box-sub" text-anchor="middle">处理一次请求</text>

    <path d="M 190 168 L 190 194" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

    <rect x="0" y="196" width="380" height="118" rx="14" fill="#0f172a"/>
    <rect x="0" y="196" width="380" height="118" rx="14" fill="rgba(6,78,59,0.24)" stroke="#34d399" stroke-width="1.5"/>
    <text x="190" y="224" class="box-title" text-anchor="middle">模块内部处理细节</text>
    <text x="190" y="246" class="box-sub" text-anchor="middle">规则 / 流程 / 外部依赖 / 输入输出</text>
    <rect x="56" y="270" width="268" height="28" rx="6" fill="rgba(52,211,153,0.18)" stroke="#34d399" stroke-width="1"/>
    <text x="190" y="289" class="tiny" text-anchor="middle">测试也走同一个入口</text>
  </g>

  <rect x="72" y="468" width="318" height="52" rx="10" fill="#0f172a"/>
  <rect x="72" y="468" width="318" height="52" rx="10" fill="rgba(6,78,59,0.34)" stroke="#34d399" stroke-width="1.3"/>
  <text x="94" y="498" class="good">结果：调用方少操心，内部改动更集中</text>

  <text x="490" y="584" fill="#94a3b8" font-size="11" text-anchor="middle">如果能把零散细节收进模块内部，让外部用法更简单，这就是值得深化的机会。</text>
</svg>
